name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"    # every 12 hours at minute 0 (UTC)
  workflow_dispatch:

permissions:
  contents: write              # needed for pushing to the output branch

jobs:
  build:
    name: Generate & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: chandana-galgali
          # light + dark versions in the portfolio's teal; the original file is kept for old links
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/snake-light.svg?palette=github-light&color_snake=#6d28d9&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#0f3d38,#0d9488,#2dd4bf,#5eead4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
